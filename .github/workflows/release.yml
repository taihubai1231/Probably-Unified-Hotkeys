name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag (e.g. v1.5.0)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-release:
    name: Build & Package Release
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore Game Managed Assemblies Cache
        id: cache-game-assemblies
        uses: actions/cache@v4
        with:
          path: managed-libs
          key: game-managed-assemblies-${{ runner.os }}

      - name: Check Game Dependencies
        id: check-deps
        shell: pwsh
        run: |
          $managedDir = "managed-libs"
          if (Test-Path "$managedDir\Assembly-CSharp.dll") {
            "has_deps=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            "managed_dir=$managedDir" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } elseif ($env:PROBABLY_STOLEN_DIR -and (Test-Path "$env:PROBABLY_STOLEN_DIR\Probably Stolen_Data\Managed\Assembly-CSharp.dll")) {
            "has_deps=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            "managed_dir=$env:PROBABLY_STOLEN_DIR\Probably Stolen_Data\Managed" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } else {
            "has_deps=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }

      - name: Setup .NET SDK
        if: steps.check-deps.outputs.has_deps == 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Run Unit Tests & Build Mod (if game assemblies cached)
        if: steps.check-deps.outputs.has_deps == 'true'
        shell: pwsh
        run: |
          $managedDir = "${{ steps.check-deps.outputs.managed_dir }}"
          dotnet test tests/ProbablyUnifiedHotkeys.Tests/ProbablyUnifiedHotkeys.Tests.csproj -c Release -p:ContinuousIntegrationBuild=true -p:DeployToGame=false -p:ManagedDir="$managedDir"
          dotnet build src/ProbablyUnifiedHotkeys/ProbablyUnifiedHotkeys.csproj -c Release -p:ContinuousIntegrationBuild=true -p:DeployToGame=false -p:ManagedDir="$managedDir"

      - name: Assemble Release Package
        id: package
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ([string]::IsNullOrWhiteSpace($tag) -or $tag -eq "main") {
            $tag = "${{ github.event.inputs.release_tag }}"
            if ([string]::IsNullOrWhiteSpace($tag)) { $tag = "v1.5.0" }
          }
          $dllSource = "src/ProbablyUnifiedHotkeys/bin/Release/netstandard2.1/ProbablyUnifiedHotkeys.dll"
          if (-not (Test-Path $dllSource)) {
            $dllSource = ".github/release-assets/ProbablyUnifiedHotkeys.dll"
          }
          if (Test-Path $dllSource) {
            $zipName = "ProbablyUnifiedHotkeys-$tag.zip"
            $stageDir = "staging/probably_unified_hotkeys"
            New-Item -ItemType Directory -Force -Path $stageDir | Out-Null
            Copy-Item $dllSource -Destination "$stageDir/ProbablyUnifiedHotkeys.dll"
            Copy-Item "src/ProbablyUnifiedHotkeys/manifest.xml" -Destination $stageDir/
            Copy-Item "README.md" -Destination $stageDir/
            Copy-Item "src/ProbablyUnifiedHotkeys/preview.png" -Destination $stageDir/
            Compress-Archive -Path "staging/*" -DestinationPath $zipName -Force
            "has_zip=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            Write-Host "Successfully packaged $zipName"
          } else {
            "has_zip=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }

      - name: Generate Release Notes
        shell: pwsh
        run: |
          $notes = @(
            "## v1.5.1 更新说明",
            "",
            "1. 新增选项页面显示位置三态切换，支持模组界面合并至原版界面、模组独立界面在原版选项页左下角放置模组设置入口，以及切换为原版设置界面仅从改造件页面齿轮打开模组配置。",
            "2. 支持通过拖动上下移动卡片顺序，提供按名称升序、按名称降序、自由拖动排列、最近启用优先、按键数量优先与游戏加载顺序 6 种排序方式，卡片排布顺序随预设方案保存。",
            "3. 在改造件齿轮页与本模组卡片内开放 7 组功能设置，支持单独调整工具栏控件显隐、打字停顿响应延时、按键录入与冲突规则、界面语言及各项加速开关。",
            "4. 修复「物品堆叠增强」等动态本地化模组在游戏主菜单阶段引发的选项页回退问题；为本地未打包图片的工坊模组补充 Steam 云端封面预请求与跨页面缓存。"
          ) -join "`n"
          $notes | Out-File -FilePath "release_notes.md" -Encoding utf8

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.package.outputs.has_zip == 'true' && 'ProbablyUnifiedHotkeys-*.zip' || '' }}
          body_path: release_notes.md
          draft: false
          prerelease: false
